apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      enableServiceLinks: false
      containers:
      - name: superset
        image: habtech-superset:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8088
        env:
        - name: SUPERSET_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: superset-secrets
              key: SUPERSET_SECRET_KEY
        volumeMounts:
        - name: superset-config
          mountPath: /app/pythonpath/superset_config.py
          subPath: superset_config.py
        - name: superset-home
          mountPath: /app/superset_home
      volumes:
      - name: superset-config
        configMap:
          name: superset-config
      - name: superset-home
        hostPath:
          path: /mnt/superset_home
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: default
spec:
  type: NodePort
  selector:
    app: superset
  ports:
  - port: 8088
    targetPort: 8088
    nodePort: 30088
