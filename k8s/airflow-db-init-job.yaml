apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-db-init
spec:
  template:
    spec:
      containers:
        - name: airflow-db-init
          image: habtech-airflow:latest
          imagePullPolicy: Never
          command: ["airflow", "db", "init"]
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow"
      restartPolicy: Never
  backoffLimit: 1
