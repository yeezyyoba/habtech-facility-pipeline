version: 1
default_environment: dev
project_id: habtech-meltano
plugins:
  extractors:
    - name: tap-csv
      variant: meltanolabs
      pip_url: git+https://github.com/MeltanoLabs/tap-csv.git
      config:
        files:
          - entity: mfr_facilities
            path: "/data/mfr_facilities_202607291153.csv"
            keys: [id]
          - entity: dhis2_facilities
            path: "/data/dhis2_facilities.csv"
            keys: [uid]
          - entity: org_units
            path: "/data/org_units_202608201004 (1).csv"
            keys: [id]
  loaders:
    - name: target-clickhouse
      variant: shaped-ai
      pip_url: git+https://github.com/shaped-ai/target-clickhouse.git
      config:
        host: host.docker.internal
        port: 8123
        username: habtech_airflow
        password: habtechpass123
        database: staging
environments:
  - name: dev
  - name: staging
  - name: prod
